name: Parcours

# Real user journeys on Windows and macOS, the only places the CI is our bench.
# Never runs on a release.

on:
  push:
    branches: ["test/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x
      - name: Build MCManager.zip
        run: python Windows/build_release.py
      - name: Publish the app
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          $out = Join-Path $PWD "build\app"
          & $msbuild apps\windows\MCManager.App\MCManager.App.csproj -restore -m -t:Publish -p:Configuration=Release -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:SelfContained=true -p:PublishDir="$out\" -nologo -v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern '\berror [A-Z]+[0-9]+' | Select-Object -First 10 | ForEach-Object { "::error::" + $_.Line.Trim() }
            exit 1
          }
      - name: Install Inno Setup
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build MCManager-Setup.exe
        run: python packaging/windows/build_installer.py --zip dist/MCManager.zip --app build/app --out dist --work "$env:RUNNER_TEMP/setup"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: parcours-setup
          path: dist/MCManager-Setup.exe
          if-no-files-found: error
          retention-days: 1

  windows-upgrade:
    name: Windows - v2.4.8 then 3.0 over it
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Download the published installer (releases/latest)
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Invoke-WebRequest "https://github.com/scirr/MCMANAGER/releases/latest/download/MCManager-Setup.exe" -OutFile dist\MCManager-Setup.exe
      - name: Parcours
        shell: pwsh
        run: ./tools/parcours/win_upgrade.ps1 -Setup "$PWD\dist\MCManager-Setup.exe"

  windows-fresh:
    name: Windows - fresh 3.0 (accents and spaces)
    needs: windows-build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: parcours-setup
          path: dist
      - name: Parcours
        shell: pwsh
        run: ./tools/parcours/win_fresh.ps1 -Setup "$PWD\dist\MCManager-Setup.exe"

  macos:
    name: macOS - fresh install
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build MCManager-macOS.zip
        run: python3 macOS/build_release.py
      - name: Parcours
        run: ./tools/parcours/mac_fresh.sh "$PWD/dist/MCManager-macOS.zip"
