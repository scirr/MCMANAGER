name: Release

# Two ways to publish:
# - Actions > Release > Run workflow (on main): the version is read from
#   mc_lang.py and everything happens in this run; the tag is created on
#   main's commit by the final publish step only, so a failed run leaves
#   nothing behind and can simply be run again;
# - pushing a vX.Y.Z tag.

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    name: Check version and tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the versions and the notes agree
        id: version
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' Linux/mc_lang.py)
          if [ "$EVENT" = "push" ]; then
            tag="$GITHUB_REF_NAME"
          else
            tag="v$version"
          fi
          for f in Linux/mc_lang.py Windows/mc_lang.py; do
            found=$(sed -n 's/^VERSION = "\(.*\)"$/\1/p' "$f")
            if [ "v$found" != "$tag" ]; then
              echo "::error file=$f::VERSION is $found, the release is $tag"
              exit 1
            fi
          done
          if [ ! -f "release-notes/$tag.md" ]; then
            echo "::error::release-notes/$tag.md is missing"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Check this version can be published from here
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow on main (selected: $GITHUB_REF_NAME)"
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists: bump VERSION in both mc_lang.py files first"
            exit 1
          fi

  tests:
    name: Tests (${{ matrix.platform }})
    needs: prepare
    strategy:
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: ${{ matrix.platform }}
        run: python -m unittest discover tests

  release:
    name: Build, sign and publish
    needs: [prepare, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      TAG: ${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build both packages
        run: |
          (cd Linux && python build_release.py)
          (cd Windows && python build_release.py)
      - name: Sign
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          python -m pip install --disable-pip-version-check "cryptography==50.0.1"
          python tools/sign_release.py dist
      - name: Build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/MCManager.zip
            dist/MCManager-Linux.zip
            dist/SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # A pushed tag must already exist; a manual run creates it here, on
          # the tested commit, only once everything else has succeeded.
          if [ "$EVENT" = "push" ]; then
            target="--verify-tag"
          else
            target="--target=$SHA"
          fi
          gh release create "$TAG" \
            dist/MCManager.zip dist/MCManager-Linux.zip dist/SHA256SUMS dist/SHA256SUMS.sig \
            --repo "$GITHUB_REPOSITORY" \
            --title "MC Manager $TAG" \
            --notes-file "release-notes/$TAG.md" \
            "$target" \
            --latest
