name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: ${{ matrix.platform }}
        run: python -m unittest discover tests

  checks:
    name: Lint, security, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "bandit==1.9.4" "pip-audit==2.10.1"
      - name: ruff
        run: ruff check Linux Windows tools
      - name: bandit (medium and above)
        run: bandit -r Linux Windows tools -ll -x Linux/tests,Windows/tests
      - name: pip-audit
        run: pip-audit -r Linux/requirements.txt
