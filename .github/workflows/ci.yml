name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux
            os: ubuntu-latest
          - platform: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        working-directory: ${{ matrix.platform }}
        run: python -m unittest discover tests

  checks:
    name: Lint, security, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "bandit==1.9.4" "pip-audit==2.10.1"
      - name: ruff
        run: ruff check Linux Windows tools
      - name: bandit (medium and above)
        run: bandit -r Linux Windows tools -ll -x Linux/tests,Windows/tests
      - name: pip-audit
        run: pip-audit -r Linux/requirements.txt
