name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests (${{ matrix.platform }}, Python ${{ matrix.python }})
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
        os: [ubuntu-latest, windows-latest, macos-latest]
        include:
          - os: ubuntu-latest
            platform: Linux
          - os: windows-latest
            platform: Windows
          - os: macos-latest
            platform: macOS
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        working-directory: core
        run: python ../tools/run_tests_ci.py tests
      - name: CLI smoke test
        if: always()
        run: python tools/cli_smoke_ci.py core

  checks:
    name: Lint, security, dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install --disable-pip-version-check "ruff==0.16.9" "bandit==1.9.4" "pip-audit==2.10.1"
      - name: ruff
        run: ruff check core Linux Windows tools packaging
      - name: bandit (medium and above)
        run: bandit -r core Linux Windows tools packaging -ll -x core/tests
      - name: pip-audit
        run: pip-audit -r Linux/requirements.txt

  packages:
    name: Linux packages (.deb, .rpm)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install rpmbuild
        run: sudo apt-get install -y --no-install-recommends rpm
      - name: Build both packages
        run: python3 packaging/linux/build_packages.py --out dist
      - name: Inspect the .deb
        run: |
          dpkg-deb --info dist/mcmanager_*_all.deb
          dpkg-deb --contents dist/mcmanager_*_all.deb
      - name: Inspect the .rpm
        run: |
          rpm -qpi dist/mcmanager-*.noarch.rpm
          rpm -qpl dist/mcmanager-*.noarch.rpm
          rpm -qp --scripts dist/mcmanager-*.noarch.rpm
      - name: Install the .deb and run it
        run: |
          sudo apt-get install -y ./dist/mcmanager_*_all.deb
          dpkg -s mcmanager
          test -x /usr/bin/mc
          test -f /lib/systemd/system/mc_manager.service
          mc version
          mc doctor --json || test $? -eq 3
          mc update --json || test $? -eq 1
      - name: Remove and purge the .deb
        run: |
          sudo apt-get purge -y mcmanager
          test ! -e /usr/bin/mc

  app-linux:
    name: Desktop app (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install GTK 4, libadwaita and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gir1.2-adw-1 gir1.2-gtk-4.0 python3-gi xvfb appstream desktop-file-utils
      - name: Tests (logic and views)
        working-directory: apps/linux
        run: xvfb-run -a /usr/bin/python3 -m unittest discover tests -v
      - name: Start the window
        working-directory: apps/linux
        run: |
          xvfb-run -a /usr/bin/python3 - <<'EOF'
          import gi
          gi.require_version("Gtk", "4.0")
          gi.require_version("Adw", "1")
          from gi.repository import Adw, GLib
          from mcmanager_app.ui.application import Application
          app = Application()
          GLib.timeout_add(1500, app.quit)
          assert app.run([]) == 0
          assert app.window is not None
          EOF
      - name: Validate desktop file and metadata
        working-directory: apps/linux/data
        run: |
          desktop-file-validate io.github.scirr.MCManager.desktop
          appstreamcli validate --no-net io.github.scirr.MCManager.metainfo.xml
      - name: Build the Flatpak (non-blocking, slow and depends on Flathub)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47
          flatpak-builder --user --install-deps-from=flathub --force-clean --disable-rofiles-fuse --state-dir="$RUNNER_TEMP/fb-state" "$RUNNER_TEMP/fb-build" apps/linux/flatpak/io.github.scirr.MCManager.yml

  app-windows-libs:
    name: Windows app libraries (client, view models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Client tests
        run: dotnet test apps/windows/MCManager.Client.Tests -c Release
      - name: View model tests
        run: dotnet test apps/windows/MCManager.ViewModels.Tests -c Release

  app-windows:
    name: Windows app (WinUI 3 build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Build
        working-directory: apps/windows
        shell: pwsh
        run: |
          $msbuild = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          & $msbuild MCManager.App\MCManager.App.csproj -restore -m -p:Configuration=Release -p:Platform=x64 -nologo -v:minimal 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            Select-String -Path build.log -Pattern '\berror [A-Z]+[0-9]+' | Select-Object -First 10 | ForEach-Object { "::error::" + $_.Line.Trim() }
            exit 1
          }

  app-macos:
    name: macOS app (SwiftPM build and tests)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        working-directory: apps/macos
        shell: bash
        run: |
          set -o pipefail
          swift build 2>&1 | tee build.log || {
            grep ' error: ' build.log | sort -u | head -10 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Test
        working-directory: apps/macos
        shell: bash
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log || {
            grep -E ' error: |failed' test.log | sort -u | head -10 | while read -r line; do echo "::error::$line"; done
            exit 1
          }
